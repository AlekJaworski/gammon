[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gamrs"
version = "0.4.0"
description = "GAM core (Rust) with sklearn-style Python bindings — beta"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["statistics", "gam", "regression", "splines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    # SHASH err-param σ for the quantile fast_oos tail path (gamrs._shash).
    # Lazy-imported with a graceful fallback, so it is not load-bearing for
    # non-quantile use — but shipped by default so fast_oos is tail-accurate.
    "scipy>=1.7",
]

[tool.maturin]
features = ["python"]
module-name = "gamrs._gamrs_native"
python-source = "python"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Tiered suite (see tests/python/conftest.py):
#   smoke  — fast API + regression guards (sub-second)
#   parity — mgcv reference parity over all families (high coverage)
#   slow   — large-n parity fixtures, deselected by default
# Default run = smoke + parity. Full battery: pytest -m "smoke or parity or slow".
addopts = "-m 'not slow' -q"
markers = [
    "smoke: fast essential correctness + regression guards",
    "parity: numerical parity against mgcv reference fixtures",
    "slow: large-n parity fixtures (run explicitly with -m slow)",
]
