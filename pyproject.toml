[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gammon"
version = "0.1.0a1"
description = "GAM core (Rust) with sklearn-style Python bindings — alpha"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["statistics", "gam", "regression", "splines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
]

[tool.maturin]
features = ["python"]
module-name = "gammon._gammon_native"
python-source = "python"
manifest-path = "Cargo.toml"
