[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gamrs"
version = "0.5.3"
description = "GAM core (Rust) with sklearn-style Python bindings — beta"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["statistics", "gam", "regression", "splines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
]

# scipy unlocks the SHASH err-param σ for `fit_quantile(preset="fast_oos")`
# (tighter τ≈0.99 OOS pinball) and is required by the `quality_oos` CV path
# (`tune_quantile_sigma`). `_shash.py` is lazy-imported with a graceful
# fallback (elf_sigma=0 heuristic — the 0.4.0 behaviour), so the base wheel
# works without it. Optional so the base wheel keeps building on Python
# versions / platforms where scipy has no wheel yet (e.g. cp314).
[project.optional-dependencies]
quantile = ["scipy>=1.7"]

[tool.maturin]
features = ["python"]
module-name = "gamrs._gamrs_native"
python-source = "python"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Tiered suite (see tests/python/conftest.py):
#   smoke  — fast API + regression guards (sub-second)
#   parity — mgcv reference parity over all families (high coverage)
#   slow   — large-n parity fixtures, deselected by default
# Default run = smoke + parity. Full battery: pytest -m "smoke or parity or slow".
addopts = "-m 'not slow' -q"
markers = [
    "smoke: fast essential correctness + regression guards",
    "parity: numerical parity against mgcv reference fixtures",
    "slow: large-n parity fixtures (run explicitly with -m slow)",
]
