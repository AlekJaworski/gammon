name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev gfortran
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Full target set (lib + tests + benches), errors on warnings.
        # Benches were ported to the current `Array2<f64>` fit API in
        # task #105 so `--all-targets` no longer skips them.
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check (python feature)
        # Default features do NOT include `python`, so `cargo test` never
        # compiles src/python.rs. On 2026-05-29 that let an accidental
        # file truncation (ad0821e) ship to a release tag. This step
        # compiles the python cfg path on every push so a broken
        # src/python.rs fails CI even before the wheel build.
        run: cargo check --features python
      - name: cargo test (release)
        run: cargo test --release

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev gfortran
      - name: Create venv + install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip maturin numpy pandas pytest
      - name: maturin develop
        run: |
          source .venv/bin/activate
          maturin develop --release --features python
      - name: pytest (full battery incl. slow)
        # Runs the tiered Python suite under tests/python: smoke (API +
        # regression guards) + parity (mgcv reference parity across all
        # families) + slow (large-n fixtures). The whole battery is well
        # under a second of fits, so CI runs every tier.
        run: |
          source .venv/bin/activate
          python -m pytest tests/python -m "smoke or parity or slow"
