name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          OPENBLAS_STATIC: "1"
          # Build a runtime-CPU-dispatched OpenBLAS (openblas-src 0.10.16
          # honours this) so the static wheel runs on any x86-64 — without it
          # OpenBLAS bakes the CI runner's ISA (AVX-512) and SIGILLs on
          # AVX2-only hosts (the 0.11.0–0.11.2 wheel bug).
          OPENBLAS_DYNAMIC_ARCH: "1"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --no-default-features --features python,blas,blas-static
          sccache: "true"
          manylinux: auto
          before-script-linux: |
            set -e
            if command -v yum &> /dev/null; then
              yum install -y gcc-gfortran openssl-devel pkgconfig make cmake perl
            else
              apt-get update && apt-get install -y gfortran libssl-dev pkg-config make cmake perl
            fi
      - name: Validate wheel
        run: |
          python -m pip install --upgrade pip numpy pytest
          python -m pip install --no-index --find-links dist/ gamrs
          python -c "import gamrs; print('linux wheel imported OK')"
      - name: Portability guard (runtime-dispatched OpenBLAS)
        # Fails the release CLOSED if the static OpenBLAS is not runtime-CPU-
        # dispatched. The 0.11.0–0.11.2 wheels SIGILLed on AVX2-only hosts
        # because the build baked the runner's AVX-512 kernels (DYNAMIC_ARCH
        # off). `OPENBLAS_CORETYPE=HASWELL` forces an AVX2-only kernel: a
        # DYNAMIC_ARCH build honors it (OpenBLAS init prints `Core: Haswell`);
        # a single-arch AVX-512 build ignores it and prints its baked core
        # (e.g. `SkylakeX`) — which we reject. A real fit forces the BLAS call
        # that triggers the init log, and would itself SIGILL if the forced
        # kernel were unrunnable.
        run: |
          set -euo pipefail
          OPENBLAS_VERBOSE=2 OPENBLAS_CORETYPE=HASWELL \
            python tools/portability_check.py 2> openblas.log || { cat openblas.log; exit 1; }
          echo "--- OpenBLAS runtime init log ---"; cat openblas.log
          if ! grep -iq 'core *: *haswell' openblas.log; then
            echo "::error::OpenBLAS did not honor OPENBLAS_CORETYPE=HASWELL — the static"
            echo "::error::build is NOT runtime-CPU-dispatched (DYNAMIC_ARCH lost). This"
            echo "::error::wheel would SIGILL on non-AVX-512 hosts. Refusing to ship."
            exit 1
          fi
          echo "Portability guard OK: runtime CPU dispatch confirmed (Haswell kernel honored)."
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6
      # For blas-static: openblas-src compiles from source, no brew openblas needed.
      # Only install the Fortran compiler.
      - name: Install build tools
        run: brew install gcc  # provides gfortran
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          OPENBLAS_STATIC: "1"
          # Build a runtime-CPU-dispatched OpenBLAS (openblas-src 0.10.16
          # honours this) so the static wheel runs on any x86-64 — without it
          # OpenBLAS bakes the CI runner's ISA (AVX-512) and SIGILLs on
          # AVX2-only hosts (the 0.11.0–0.11.2 wheel bug).
          OPENBLAS_DYNAMIC_ARCH: "1"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --no-default-features --features python,blas,blas-static
          sccache: "true"
      - name: Validate wheel
        run: |
          python3 -m pip install numpy pytest
          python3 -m pip install --no-index --find-links dist/ gamrs
          python3 -c "import gamrs; print('macos wheel imported OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # Windows uses Intel MKL static — avoids gfortran/MSYS2.
      # intel-mkl-src downloads MKL automatically.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: x86_64
          args: --release --out dist --find-interpreter --no-default-features --features python,blas,blas-mkl-static
          sccache: "true"
      - name: Validate wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip numpy pytest
          python -m pip install --no-index --find-links dist/ gamrs
          python -c "import gamrs; print('windows wheel imported OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  # ---------------------------------------------------------------------
  # crates.io publish — task #101.
  #
  # Gated on `github.event_name == 'release'` so `workflow_dispatch` runs
  # (which only build/upload wheels) don't accidentally double-publish.
  # Runs *after* every wheel + sdist + PyPI job succeeds: a crates.io
  # publish is irreversible (the version is permanently burned), so we
  # wait until the Python side is fully green.
  #
  # Precondition: the crate name `gamrs` must be claimable on crates.io
  # under the `AlekJaworski` account (matches `repository = "…/gamrs"` in
  # Cargo.toml). For the very first publish, do a manual `cargo publish
  # --dry-run` then `cargo publish` from a workstation so the name is
  # owned before this job runs.
  # ---------------------------------------------------------------------
  publish-crates:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, publish-pypi]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenBLAS (sdist build deps)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev gfortran
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
        run: cargo publish --dry-run --token "$CARGO_TOKEN"
      - name: cargo publish
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
        run: cargo publish --token "$CARGO_TOKEN"
