[package]
name = "gamrs"
version = "0.4.0"
edition = "2021"
description = "Generalised Additive Models in Rust — 10 families, multi-smooth (y ~ s(x0) + s(x1)), tensor products te(x0, x1), Python bindings via PyO3."
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlekJaworski/gamrs"
keywords = ["statistics", "regression", "gam", "smoothing", "mgcv"]
categories = ["science", "mathematics"]

[lib]
name = "gamrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
thiserror = "2.0"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1.3", optional = true }

# ndarray-linalg gated behind `blas` so the BLAS backend (system OpenBLAS,
# static OpenBLAS, or Intel MKL) is selected explicitly per platform. See
# the [features] block below and .github/workflows/release.yml for the
# per-OS recipe.
[dependencies.ndarray-linalg]
version = "0.17"
optional = true
default-features = false

[features]
# Default features set for dev ergonomics. `cargo check`, `cargo clippy`,
# and `maturin develop` (all without --features) exercise every cfg path
# and link the system OpenBLAS that the dev box already has installed.
#
# Release wheel pipelines (.github/workflows/release.yml) MUST pass
# `--no-default-features` and pick the platform-correct static backend
# explicitly: `blas-system` (Linux apt openblas), `blas-static` (macOS
# brew openblas + delocate), `blas-mkl-static` (Windows — avoids Fortran
# toolchain). Defaults + a wheel's explicit static feature would union
# into double-linked OpenBLAS and break the build.
default = ["persistence", "blas", "blas-system"]
python = ["dep:pyo3", "dep:numpy", "persistence"]
persistence = ["dep:serde", "dep:serde_json", "dep:bincode", "ndarray/serde"]
# BLAS features — pick exactly one of blas-system / blas-static / blas-mkl-static.
blas = ["dep:ndarray-linalg"]
blas-system = ["ndarray-linalg/openblas-system"]      # Linux / dev box
blas-static = ["ndarray-linalg/openblas-static"]      # macOS wheel
blas-mkl-static = ["ndarray-linalg/intel-mkl-static"] # Windows wheel

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "bench_gaussian"
path = "benches/bench_gaussian.rs"
harness = false

[[bench]]
name = "bench_baseline"
path = "benches/bench_baseline.rs"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release-quality runtime with ~3-4× faster compile vs `release`.
# Use for development iteration; keep `release` for CI / publishes.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.dev]
opt-level = 1
