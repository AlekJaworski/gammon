[package]
name = "gamrs"
version = "0.1.0-alpha.2"
edition = "2021"
description = "Generalised Additive Models in Rust — 10 families, multi-smooth (y ~ s(x0) + s(x1)), tensor products te(x0, x1), Python bindings via PyO3."
license = "MIT"
readme = "README.md"
repository = "https://github.com/AlekJaworski/gamrs"
keywords = ["statistics", "regression", "gam", "smoothing", "mgcv"]
categories = ["science", "mathematics"]

[lib]
name = "gamrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
ndarray-linalg = { version = "0.17", default-features = false, features = ["openblas-system"] }
thiserror = "2.0"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["persistence"]
python = ["dep:pyo3", "dep:numpy", "persistence"]
persistence = ["dep:serde", "dep:serde_json", "ndarray/serde"]

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "bench_gaussian"
path = "benches/bench_gaussian.rs"
harness = false

[[bench]]
name = "bench_baseline"
path = "benches/bench_baseline.rs"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release-quality runtime with ~3-4× faster compile vs `release`.
# Use for development iteration; keep `release` for CI / publishes.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.dev]
opt-level = 1
